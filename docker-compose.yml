# Despliegue local: base de datos PostgreSQL + API REST de citas.
# Uso:  docker compose up -d --build     (luego abrir http://localhost:8080/swagger-ui.html)
services:
  db:
    image: postgres:16-alpine
    container_name: clinica-db
    environment:
      POSTGRES_DB: clinica_salvador
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica123
      TZ: America/Bogota
    ports:
      - "5433:5432"        # 5433 en el equipo para no chocar con un PostgreSQL local
    volumes:
      - datos-clinica:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica -d clinica_salvador"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: clinica-salvador-api:1.0.0
    container_name: clinica-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/clinica_salvador
      DB_USER: clinica
      DB_PASSWORD: clinica123
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  datos-clinica:
