spring:
  application:
    name: clinica-salvador-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinica_salvador}
    username: ${DB_USER:clinica}
    password: ${DB_PASSWORD:clinica123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Bogota

server:
  port: ${PORT:8080}
  error:
    include-message: always

agenda:
  zona-horaria: America/Bogota

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
